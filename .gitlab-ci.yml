# The same model-free checks as .github/workflows/portability.yml, for an organization's GitLab copy of the kit.
# No API key, no CLI installed, and AI_KIT_NO_LIVE=1 refuses any real call. Linux runners only: the macOS and Windows
# jobs of the GitHub workflow have no equivalent on a default GitLab runner. release-zip-test installs the ZIP with no package
# index reachable, as a workstation will. On a vX.Y.Z tag, publish-release attaches the
# ZIP to the tag's GitLab release (scripts/gitlab_release.py); the runner of release-zip needs a package index for the wheels. Images are pinned by tag; pin them by digest if your registry policy asks for it.
variables:
  AI_KIT_NO_LIVE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

stages: [test, release, publish]

tests:
  stage: test
  image: python:${PYTHON}
  variables:
    GIT_DEPTH: 0  # 3.0: the launcher tests build a ZIP whose Core bundle needs the whole history
  parallel:
    matrix:
      - PYTHON: ["3.11", "3.14"]  # the bounds of requires-python: 3.12 and 3.13 sit between them
  script:
    # The launcher tests install the kit with pip from a local folder of wheels, standing for a company's package index.
    - 'python -m pip download --quiet --only-binary=:all: --no-deps -d build/wheelhouse -r packaging/runtime.txt hatchling==1.27.0 packaging pathspec pluggy trove-classifiers'
    - python -m pip install --quiet --no-index --find-links build/wheelhouse -r packaging/runtime.txt
    - python scripts/offline_tests.py discover -s tests -v

lint:
  stage: test
  image: python:3.12
  script:
    - pip install --quiet ruff==0.6.9 check-jsonschema==0.29.4
    - ruff check .
    - check-jsonschema --check-metaschema schemas/managed.schema.json schemas/aikit.schema.json schemas/source.schema.json
    - check-jsonschema --schemafile schemas/source.schema.json aikit.toml examples/team-repo/aikit.toml
    - check-jsonschema --schemafile schemas/aikit.schema.json templates/user-aikit.toml
    - python3 scripts/check_news.py
    - python3 runtime/check_skills.py

release-zip:
  stage: release
  image: python:3.12
  variables:
    GIT_DEPTH: 0  # 2.2: the ZIP ships the Core as a git bundle of this repository at its tag: the whole history
  script:
    - python scripts/build_release.py
  artifacts:
    paths: [dist/*.zip]
    expire_in: 30 days

release-zip-test:
  # The ZIP people download, extracted and installed by its launcher with no package index reachable: its own wheels only.
  stage: release
  image: python:${PYTHON}
  needs: [release-zip]
  variables:
    GIT_DEPTH: 0  # 3.0: the launcher tests build a ZIP whose Core bundle needs the whole history
    PIP_INDEX_URL: "http://127.0.0.1:9/simple"
  parallel:
    matrix:
      - PYTHON: ["3.11", "3.14"]
  script:
    - export AI_KIT_RELEASE_ZIP="$PWD/$(ls dist/*.zip)"
    - python -m unittest discover -s tests -p test_enterprise_install.py -v

publish-release:
  stage: publish
  image: python:3.12
  needs: [release-zip, release-zip-test]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
  script:
    - python scripts/gitlab_release.py
