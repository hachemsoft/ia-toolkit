# Actions are pinned by commit SHA; Dependabot proposes the updates as merge requests.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:  # packaging/runtime.txt pins them on adjacent lines: one merge request, not one per package
      runtime:
        patterns: ["*"]
    ignore:  # hatchling 1.33 needs tomlkit at build time, one more wheel for every approved index to carry
      - dependency-name: hatchling
