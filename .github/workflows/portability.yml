name: Portability
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.11', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Native unit and integration tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-output.txt
      - name: Failed tests as annotations
        if: failure()
        shell: bash
        run: python scripts/ci_annotations.py test-output.txt
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ruff check
        run: pip install ruff==0.6.9 && ruff check .
      - name: JSON files follow their schemas
        run: |
          pip install check-jsonschema==0.29.4
          check-jsonschema --check-metaschema schemas/overrides.schema.json schemas/organization.schema.json
          check-jsonschema --schemafile schemas/organization.schema.json organization.json
          check-jsonschema --schemafile schemas/overrides.schema.json templates/user-overrides.json
