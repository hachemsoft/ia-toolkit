name: Portability
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Model-free: no API key, no CLI installed, and AI_KIT_NO_LIVE=1 refuses any real call. Paid evals: agent-evals.yml, manual only.
env:
  AI_KIT_NO_LIVE: '1'
jobs:
  native-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # The launcher tests install the kit with pip from a local folder of wheels, standing for a company's package index.
      - name: Local wheelhouse and interface libraries
        shell: bash
        run: |
          python -m pip download --quiet --only-binary=:all: --no-deps -d build/wheelhouse -r packaging/runtime.txt hatchling==1.27.0 packaging pathspec pluggy trove-classifiers tomli
          # The pure-Python tomli the release ZIP ships (on 3.11 to 3.13, pip would only fetch a compiled one).
          python -m pip download --quiet --only-binary=:all: --no-deps --python-version 3.9 -d build/wheelhouse tomli==2.2.1
          python -m pip install --quiet --no-index --find-links build/wheelhouse -r packaging/runtime.txt
      - name: Native unit and integration tests (no model CLI reachable)
        shell: bash
        run: |
          set -o pipefail
          python scripts/offline_tests.py discover -s tests -v 2>&1 | tee test-output.txt
      - name: Failed tests as annotations
        if: failure()
        shell: bash
        run: python scripts/ci_annotations.py test-output.txt
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: ruff check
        run: pip install ruff==0.6.9 && ruff check .
      - name: Settings files follow their schemas
        run: |
          pip install check-jsonschema==0.29.4
          check-jsonschema --check-metaschema schemas/overrides.schema.json schemas/organization.schema.json
          check-jsonschema --schemafile schemas/organization.schema.json organization.toml
          check-jsonschema --schemafile schemas/overrides.schema.json templates/user-overrides.toml
  release-zip:
    name: Release ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build the ZIP people download (launchers, the kit's wheel and its dependencies' wheels)
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-zip
          path: dist/*.zip
  release-zip-test:
    name: Release ZIP on ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: release-zip
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-zip
          path: release
      - name: Extracted ZIP, launcher (Installer.cmd on Windows), spaces and accents, Python absent, new version
        shell: bash
        run: |
          set -o pipefail
          zip="$PWD/$(ls release/*.zip)"
          # Windows: a Windows path for Python (Git Bash gives /d/a/...).
          if command -v cygpath >/dev/null 2>&1; then zip="$(cygpath -w "$zip")"; fi
          export AI_KIT_RELEASE_ZIP="$zip"
          # No package index reachable: the ZIP must install from its own wheels.
          export PIP_INDEX_URL=http://127.0.0.1:9/simple
          # Some tests call the installer in this Python: before 3.11 it needs tomli, taken from the ZIP's own wheels.
          python -c "import sys, zipfile, subprocess, tempfile, pathlib; d = pathlib.Path(tempfile.mkdtemp()); zipfile.ZipFile(sys.argv[1]).extractall(d); w = next(d.rglob('wheels')); sys.version_info < (3, 11) and subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--quiet', '--no-index', '--find-links', str(w), 'tomli'])" "$zip"
          python -m unittest discover -s tests -p test_enterprise_install.py -v 2>&1 | tee test-output.txt
      - name: Failed tests as annotations
        if: failure()
        shell: bash
        run: python scripts/ci_annotations.py test-output.txt
  publish:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native-tests, lint, release-zip-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-zip
          path: release
      - name: Build provenance of the ZIP (gh attestation verify <zip> --repo <owner>/<repo>)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release/*.zip
      - name: GitHub release with the ZIP, its SHA-256 and the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 -c "import re,sys; t=open('CHANGELOG.md',encoding='utf-8').read(); m=re.search(r'^## '+re.escape(sys.argv[1])+r'\n(.*?)(?=^## |\Z)', t, re.S|re.M); print(m.group(1).strip() if m else '')" "$version" > notes.md
          # A published asset is never overwritten: a second run for the same tag fails instead of replacing what people downloaded.
          (cd release && sha256sum *.zip > SHA256SUMS.txt)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.zip release/SHA256SUMS.txt
          else
            gh release create "$GITHUB_REF_NAME" release/*.zip release/SHA256SUMS.txt --title "AI Kit $version" --notes-file notes.md
          fi
