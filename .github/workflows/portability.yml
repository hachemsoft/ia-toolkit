name: Portability
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Model-free: no API key, no CLI installed, and AI_KIT_NO_LIVE=1 refuses any real call. Paid evals: agent-evals.yml, manual only.
env:
  AI_KIT_NO_LIVE: '1'
jobs:
  native-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ['3.11', '3.14']  # the bounds of requires-python: 3.12 and 3.13 sit between them
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # 3.0: the launcher tests build a ZIP whose Core bundle needs the whole history
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # The launcher tests install the kit with pip from a local folder of wheels, standing for a company's package index.
      - name: Local wheelhouse and interface libraries
        shell: bash
        run: |
          python -m pip download --quiet --only-binary=:all: --no-deps -d build/wheelhouse -r packaging/runtime.txt hatchling==1.27.0 packaging pathspec pluggy trove-classifiers
          python -m pip install --quiet --no-index --find-links build/wheelhouse -r packaging/runtime.txt
      - name: Native unit and integration tests (no model CLI reachable)
        shell: bash
        run: |
          set -o pipefail
          python scripts/offline_tests.py discover -s tests -v 2>&1 | tee test-output.txt
      - name: Failed tests as annotations
        if: failure()
        shell: bash
        run: python scripts/ci_annotations.py test-output.txt
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: ruff check
        run: pip install ruff==0.6.9 && ruff check .
      - name: Settings files follow their schemas
        run: |
          pip install check-jsonschema==0.29.4
          check-jsonschema --check-metaschema schemas/managed.schema.json schemas/aikit.schema.json schemas/source.schema.json
          check-jsonschema --schemafile schemas/source.schema.json aikit.toml examples/team-repo/aikit.toml
          check-jsonschema --schemafile schemas/aikit.schema.json templates/user-aikit.toml
      - name: NEWS.md well formed
        run: python3 scripts/check_news.py
      - name: Skills, agents and commands carry no risky instruction, secret or undeclared script
        run: python3 runtime/check_skills.py
  release-zip:
    name: Release ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # 2.2: the ZIP ships the Core as a git bundle of this repository at its tag: the whole history
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build the ZIP people download (launchers, the kit's wheel and its dependencies' wheels)
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-zip
          path: dist/*.zip
  release-zip-test:
    name: Release ZIP on ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: release-zip
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # 3.0: the launcher tests build a ZIP whose Core bundle needs the whole history
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-zip
          path: release
      - name: Extracted ZIP, launcher (Installer.cmd on Windows), spaces and accents, Python absent, new version
        shell: bash
        run: |
          set -o pipefail
          zip="$PWD/$(ls release/*.zip)"
          # Windows: a Windows path for Python (Git Bash gives /d/a/...).
          if command -v cygpath >/dev/null 2>&1; then zip="$(cygpath -w "$zip")"; fi
          export AI_KIT_RELEASE_ZIP="$zip"
          # No package index reachable: the ZIP must install from its own wheels.
          export PIP_INDEX_URL=http://127.0.0.1:9/simple
          python -m unittest discover -s tests -p test_enterprise_install.py -v 2>&1 | tee test-output.txt
      - name: Failed tests as annotations
        if: failure()
        shell: bash
        run: python scripts/ci_annotations.py test-output.txt
  upgrade-path:
    # Indicative, not a required check and not needed by publish (docs/sdlc/2026-11-15-install-test-matrix): in a bare
    # container, the latest published release installed on a blank home, then this commit's ZIP over it; and the latest
    # published engine given this commit's Core must apply it or refuse it on min_engine, never fail otherwise (4.16 incident).
    name: Upgrade from the latest release (container, indicative)
    needs: release-zip
    runs-on: ubuntu-24.04
    container: python:3.11-slim
    steps:
      - name: Git, unzip and curl in the bare container
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git unzip curl ca-certificates >/dev/null
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-zip
          path: release
      - name: Latest published release and this commit's ZIP, extracted
        env:
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$(curl -fsSL "https://api.github.com/repos/$REPO/releases/latest" | python3 -c "import json,sys; print(json.load(sys.stdin)['tag_name'])")
          echo "Latest release: $tag"
          curl -fsSL -o previous.zip "https://github.com/$REPO/releases/download/$tag/ai-kit-${tag#v}.zip"
          mkdir previous new
          unzip -q previous.zip -d previous
          unzip -q release/*.zip -d new
      - name: The latest release on a blank home, then this commit over it
        shell: bash
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/upgrade"
          python3 previous/scripts/launcher.py init --home "$home" --target all --user ci@example.org --command-on-path no </dev/null
          python3 new/scripts/launcher.py init --home "$home" --target all --user ci@example.org --command-on-path no </dev/null
          test -f "$home/.ai-kit/context/10_CORE.md"
          python3 -c "import json,sys; v=json.load(open(sys.argv[1]))['version']; w=open(sys.argv[2]).read().strip(); sys.exit(0 if v == w else 'state.json says '+v+', this commit is '+w)" "$home/.ai-kit/state.json" new/VERSION
          before=$(cd "$home" && find . -path ./.ai-kit/backups -prune -o -type f -print0 | sort -z | xargs -0 sha256sum)
          python3 new/scripts/launcher.py init --home "$home" --target all --user ci@example.org --command-on-path no </dev/null
          after=$(cd "$home" && find . -path ./.ai-kit/backups -prune -o -type f -print0 | sort -z | xargs -0 sha256sum)
          [ "$before" = "$after" ] || { echo "::error::a second run changed files"; diff <(echo "$before") <(echo "$after"); exit 1; }
      - name: The latest published engine given this commit's Core applies it or refuses it on min_engine
        shell: bash
        run: |
          set -uo pipefail
          home="$RUNNER_TEMP/old-engine"
          python3 previous/scripts/launcher.py init --home "$home" --target all --user ci@example.org --command-on-path no </dev/null || exit 1
          # GitHub runs the step with bash -e: capture the exit code without letting a failing sync end the step unseen.
          code=0
          out=$(python3 previous/scripts/launcher.py sync --home "$home" --from-bundle "$PWD/new/core/ai-kit-core.bundle" </dev/null 2>&1) || code=$?
          echo "$out"
          if [ "$code" -ne 0 ] && ! grep -q "needs AI Kit" <<<"$out"; then
            echo "::error::the latest published engine neither applied this commit's Core nor refused it on min_engine (exit $code)"
            exit 1
          fi
  publish:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native-tests, lint, release-zip-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-zip
          path: release
      - name: Build provenance of the ZIP (gh attestation verify <zip> --repo <owner>/<repo>)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.zip
      - name: GitHub release with the ZIP, its SHA-256 and the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 -c "import re,sys; t=open('CHANGELOG.md',encoding='utf-8').read(); m=re.search(r'^## '+re.escape(sys.argv[1])+r'(?: \([0-9-]+\))?\n(.*?)(?=^## |\Z)', t, re.S|re.M); print(m.group(1).strip() if m else '')" "$version" > notes.md
          # A published asset is never overwritten: a second run for the same tag fails instead of replacing what people downloaded.
          (cd release && sha256sum *.zip > SHA256SUMS.txt)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.zip release/SHA256SUMS.txt
          else
            gh release create "$GITHUB_REF_NAME" release/*.zip release/SHA256SUMS.txt --title "AI Kit $version" --notes-file notes.md
          fi
