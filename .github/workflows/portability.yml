name: Portability
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Model-free: no API key, no CLI installed, and AI_KIT_NO_LIVE=1 refuses any real call. Paid evals: agent-evals.yml, manual only.
env:
  AI_KIT_NO_LIVE: '1'
jobs:
  native-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.11', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The launcher tests install the kit with pip from a local folder of wheels, standing for a company's package index.
      - name: Local wheelhouse and interface libraries
        shell: bash
        run: |
          python -m pip download --quiet --only-binary=:all: --no-deps -d build/wheelhouse -r packaging/runtime.txt hatchling==1.27.0 packaging pathspec pluggy trove-classifiers tomli
          python -m pip install --quiet --no-index --find-links build/wheelhouse -r packaging/runtime.txt
      - name: Native unit and integration tests (no model CLI reachable)
        shell: bash
        run: |
          set -o pipefail
          python scripts/offline_tests.py discover -s tests -v 2>&1 | tee test-output.txt
      - name: Failed tests as annotations
        if: failure()
        shell: bash
        run: python scripts/ci_annotations.py test-output.txt
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ruff check
        run: pip install ruff==0.6.9 && ruff check .
      - name: JSON files follow their schemas
        run: |
          pip install check-jsonschema==0.29.4
          check-jsonschema --check-metaschema schemas/overrides.schema.json schemas/organization.schema.json
          check-jsonschema --schemafile schemas/organization.schema.json organization.json
          check-jsonschema --schemafile schemas/overrides.schema.json templates/user-overrides.json
  release-zip:
    name: Release ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the ZIP people download (launchers, the kit's wheel and its dependencies' wheels)
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: dist/*.zip
  release-zip-test:
    name: Release ZIP on ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: release-zip
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: release-zip
          path: release
      - name: Extracted ZIP, launcher (Installer.cmd on Windows), spaces and accents, Python absent, new version
        shell: bash
        run: |
          set -o pipefail
          zip="$PWD/$(ls release/*.zip)"
          # Windows: a Windows path for Python (Git Bash gives /d/a/...).
          if command -v cygpath >/dev/null 2>&1; then zip="$(cygpath -w "$zip")"; fi
          export AI_KIT_RELEASE_ZIP="$zip"
          # No package index reachable: the ZIP must install from its own wheels.
          export PIP_INDEX_URL=http://127.0.0.1:9/simple
          python -m unittest discover -s tests -p test_enterprise_install.py -v 2>&1 | tee test-output.txt
      - name: Failed tests as annotations
        if: failure()
        shell: bash
        run: python scripts/ci_annotations.py test-output.txt
  publish:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native-tests, lint, release-zip-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-zip
          path: release
      - name: GitHub release with the ZIP and the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 -c "import re,sys; t=open('CHANGELOG.md',encoding='utf-8').read(); m=re.search(r'^## '+re.escape(sys.argv[1])+r'\n(.*?)(?=^## |\Z)', t, re.S|re.M); print(m.group(1).strip() if m else '')" "$version" > notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*.zip --title "AI Kit $version" --notes-file notes.md
          fi
