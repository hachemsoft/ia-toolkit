name: CLI drift
# Once a week, the latest release of each CLI published on npm: does it still offer what the kit relies on?
# No model call, no secret: only --version and --help. A red run means an adapter or the evals need a change.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
env:
  AI_KIT_NO_LIVE: '1'
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Latest CLIs
        run: npm install -g @google/gemini-cli@latest @openai/codex@latest @anthropic-ai/claude-code@latest
      - name: What the kit relies on
        run: python scripts/cli_drift.py --json cli-drift.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-drift
          path: cli-drift.json
