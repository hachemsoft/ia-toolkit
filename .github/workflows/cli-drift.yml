name: CLI drift
# Once a week, the latest release of each CLI published on npm: does it still offer what the kit relies on?
# No model call, no secret: only --version and --help. A red run means an adapter or the evals need a change.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
env:
  AI_KIT_NO_LIVE: '1'
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Latest CLIs
        run: npm install -g @google/gemini-cli@latest @openai/codex@latest @anthropic-ai/claude-code@latest
      - name: What the kit relies on
        run: python scripts/cli_drift.py --json cli-drift.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-drift
          path: cli-drift.json
