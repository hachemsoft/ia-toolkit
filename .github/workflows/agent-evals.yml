name: Agent evals (real model calls, billed)
# Never runs on its own: no pull_request, push or schedule trigger. Each run calls the model once per case (plus at most
# --retries extra attempts on an infrastructure error) and is billed to the GEMINI_API_KEY secret's account.
# The job timeout limits time, not money. The model-free tests run in portability.yml.
on:
  workflow_dispatch:
    inputs:
      confirm_paid_run:
        description: 'I understand this run makes real, billed calls to the model'
        type: boolean
        default: false
      only:
        description: 'Run a single case (its name), empty for all'
        type: string
        default: ''
      cli_version:
        description: 'Gemini CLI version to install (fixed for a reference campaign; empty: latest)'
        type: string
        default: ''
permissions:
  contents: read
jobs:
  evals:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_paid_run == true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      # A reference campaign pins the CLI version (input cli_version): runs compare like with like; the report records it.
      - env:
          CLI_VERSION: ${{ inputs.cli_version }}
        run: npm install -g "@google/gemini-cli${CLI_VERSION:+@$CLI_VERSION}"
      - name: Install the kit into a temporary home
        run: python3 -m installer setup --profile data-analyst --home "$RUNNER_TEMP/home" --user evals@example.org
      - name: Run evals
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ONLY: ${{ inputs.only }}
        run: python3 evals/run.py --confirm-paid-run --retries 0 --home "$RUNNER_TEMP/home" --report "$RUNNER_TEMP/evals.json" ${ONLY:+--only "$ONLY"}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: evals-report
          path: ${{ runner.temp }}/evals.json
