[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-kit"
version = "0.23.0"
description = "AI Kit: layered context, a six-step workflow, domain playbooks and review agents for Gemini CLI, Antigravity CLI and Codex CLI, on Mac and Windows."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "skills/LICENSE-UPSTREAM-MIT"]
dependencies = []
keywords = ["gemini-cli", "antigravity", "codex", "agents", "skills", "sdlc"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Environment :: Console",
]

[project.scripts]
ai-kit = "ai_kit.cli:main"

# The code lives in installer/ (python3 -m installer from the kit folder); the published package calls it ai_kit
# to avoid clashing with the PyPI package "installer". The kit content travels under ai_kit/kit/.
[tool.hatch.build.targets.wheel]
only-include = ["installer"]
sources = { "installer" = "ai_kit" }

[tool.hatch.build.targets.wheel.force-include]
"VERSION" = "ai_kit/kit/VERSION"
"organization.json" = "ai_kit/kit/organization.json"
"CHANGELOG.md" = "ai_kit/kit/CHANGELOG.md"
"runtime" = "ai_kit/kit/runtime"
"agents" = "ai_kit/kit/agents"
"commands" = "ai_kit/kit/commands"
"mcp" = "ai_kit/kit/mcp"
"practices" = "ai_kit/kit/practices"
"profiles" = "ai_kit/kit/profiles"
"skills" = "ai_kit/kit/skills"
"templates" = "ai_kit/kit/templates"

[tool.hatch.build.targets.sdist]
include = ["LICENSE", "installer", "runtime", "agents", "commands", "mcp", "practices", "profiles", "skills", "templates", "scripts", "docs", "evals", "tests", "VERSION", "organization.json", "README.md", "CHANGELOG.md", "pyproject.toml"]

[project.optional-dependencies]
dev = ["ruff"]

[tool.ruff]
target-version = "py39"
line-length = 140

[tool.ruff.lint.per-file-ignores]
# Tests written as dense lines (several statements per line): reformatting decided separately.
"tests/*" = ["E701", "E702", "E401", "E731"]
