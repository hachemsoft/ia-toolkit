# Gemini policy for the evaluations: activate skills without confirmation, refuse every write and every shell.
[[rules]]
name = "Allow skill activation"
description = "The evaluations measure the skills; their activation must not wait for a confirmation."
action = "allow"
toolName = "activate_skill"

[[rules]]
name = "Deny shell"
action = "deny"
toolName = "run_shell_command"

[[rules]]
name = "Deny write_file"
action = "deny"
toolName = "write_file"

[[rules]]
name = "Deny replace"
action = "deny"
toolName = "replace"
