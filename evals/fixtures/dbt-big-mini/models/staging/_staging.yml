version: 2
models:
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: customer_email
        data_tests:
          - not_null
      - name: country
        data_tests:
          - not_null
      - name: created_at
        data_tests:
          - not_null
  - name: stg_orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
      - name: order_date
        data_tests:
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              values: ['placed', 'shipped', 'returned']
  - name: stg_payments
    columns:
      - name: payment_id
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - not_null
      - name: amount
        data_tests:
          - not_null
      - name: method
        data_tests:
          - not_null
  - name: stg_products
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null
      - name: category
        data_tests:
          - not_null
      - name: price
        data_tests:
          - not_null
  - name: stg_order_items
    columns:
      - name: order_item_id
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - not_null
      - name: product_id
        data_tests:
          - not_null
      - name: quantity
        data_tests:
          - not_null
  - name: stg_stores
    columns:
      - name: store_id
        data_tests:
          - unique
          - not_null
      - name: city
        data_tests:
          - not_null
