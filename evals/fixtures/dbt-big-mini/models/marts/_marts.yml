version: 2
models:
  - name: dim_customers
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: customer_email
        data_tests:
          - not_null
      - name: country
        data_tests:
          - not_null
      - name: first_order_date
  - name: dim_products
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null
      - name: category
        data_tests:
          - not_null
      - name: price
        data_tests:
          - not_null
  - name: dim_stores
    columns:
      - name: store_id
        data_tests:
          - unique
          - not_null
      - name: city
        data_tests:
          - not_null
  - name: fct_orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: order_date
        data_tests:
          - not_null
      - name: amount
        data_tests:
          - not_null
  - name: fct_payments
    columns:
      - name: payment_id
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - relationships:
              to: ref('fct_orders')
              field: order_id
      - name: amount
        data_tests:
          - not_null
  - name: fct_revenue
    columns:
      - name: revenue_date
        data_tests:
          - unique
          - not_null
      - name: revenue
        data_tests:
          - not_null
