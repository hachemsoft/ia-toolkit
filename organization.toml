#:schema ./schemas/organization.schema.json
# What the organization decides, in one file: expected email domains, defaults for everyone, and teams.
# Edit it in the kit repository (merge request); each workstation gets it with the next version of the kit, then update.
# See docs/customization.md.

# Expected email domains, for example ["example.org"]; empty: no check.
allowed_domains = []

# Guardrails that stay on for everyone, whatever a team or a person writes, for example ["protected-paths"].
locked_hooks = []

# Defaults for everyone: the same keys as each person's ~/.ai-kit/overrides.toml (hooks, mcp, extra_skills,
# disabled_commands, frictions, skill_prefix...). Each person's file is applied on top: lists add up, objects
# combine, the person's value wins for a single value.
[defaults]
frictions = "propose"

# Frictions as issues of a project, created by each person's own glab or gh (signed in with their personal access token:
# no token in the kit). Without this table, frictions stay local. sources: agent (written by the agent in auto mode, the
# default), person, doctor. A person turns it off with share_frictions = false in overrides.toml. Example:
# [friction_tracker]
# kind = "gitlab"
# project = "tools/ai-kit"
# host = "gitlab.example.org"
# labels = ["friction"]
# sources = ["agent"]

# A team, between the defaults and each person (chosen at setup with --team, or the setup question); its context goes
# in practices/20-<team>.md. Example:
# [teams.data]
# extra_skills = ["sql-review", "dbt-model-change"]
# hooks = { dbt-prod-guard = true }
