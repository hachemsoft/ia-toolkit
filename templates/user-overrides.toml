#:schema ../schemas/overrides.schema.json
# Your own settings, applied on top of the organization's (organization.toml in the kit folder): lists add up,
# tables combine, your value wins for a single value. Run update after a change. See docs/customization.md.
#
# The installer's "Change my choices" writes the lists below for you; your comments stay. Examples:
#
# extra_commands = ["ask", "handoff"]
# disabled_skills = ["bigquery-cost-review"]
# skill_prefix = "ai-kit-"
#
# [hooks]
# whats-new = false   # no announcement at session start (what is new, a newer version available)
# dbt-prod-guard = true
#
# [mcp.github.server]
# command = "docker"
# args = ["run", "-i", "--rm", "-e", "GITHUB_PERSONAL_ACCESS_TOKEN", "ghcr.io/github/github-mcp-server:<pinned version>"]
# env = { GITHUB_PERSONAL_ACCESS_TOKEN = "${GITHUB_PERSONAL_ACCESS_TOKEN}" }
