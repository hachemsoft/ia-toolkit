#:schema ../schemas/aikit.schema.json
# Your own AI Kit settings, on top of the Core and your Team; IT's managed.toml wins over everything. Run ai-kit sync --offline
# after a change. See docs/configuration.md.
#
# Examples:
#
# [user]
# extra_skills = ["sql-review"]        # an optional resource, added
# disabled_commands = ["learn"]        # a default one, removed
# skill_prefix = "ai-kit-"
#
# [hooks]
# dbt-prod-guard = true            # also: git-guard, bq-cost-guard, infra-prod-guard (docs/hooks.md)
#
# [mcp]
# enabled = ["docs"]                   # a server of the Core or your Team, turned on
# denied = ["legacy-db"]               # turned off
#
# [frictions]
# capture = "propose"                  # propose | auto | off
# publication = "disabled"             # your frictions stay local
#
# [core]
# repo = "https://gitlab.example.org/ai-toolkit/ai-core.git"   # unless IT sets enterprise.core
schema = 1
